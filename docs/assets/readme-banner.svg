  <text x="58" y="155" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-1.8">WORLDANALYSIS</text>
  <rect x="60" y="178" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="218" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Evidence before understanding.</text>
  <text x="60" y="248" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Traceable materials. Independent analysis.</text>
  <text x="60" y="305" fill="#647f99" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.7">COLLECT / VERIFY / UNDERSTAND / REUSE</text>
